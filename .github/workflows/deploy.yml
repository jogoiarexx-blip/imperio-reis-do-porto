name: Build, test and deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm run build
      # Compatível com as duas fontes de Pages: GitHub Actions e branch main /.
      # A raiz nunca deve publicar index.html com /src/main.ts.
      - name: Synchronize prebuilt site for branch-based Pages
        shell: bash
        run: |
          cp dist/index.html index.html
          rm -rf assets
          cp -R dist/assets assets
          touch .nojekyll
          git add -A index.html assets .nojekyll
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'deploy: sync prebuilt GitHub Pages site [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
